name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (no linter configured)
        run: python -m compileall -q app mock

      - name: Unit tests
        run: pytest -m unit -q

      - name: API tests
        run: pytest -m api -q

      - name: Integration tests
        run: pytest -m integration -q

      - name: Full suite with coverage and JUnit output
        run: |
          mkdir -p artifacts
          pytest --cov=app --cov=mock --cov-report=term-missing \
            --junitxml=artifacts/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: artifacts/junit.xml
