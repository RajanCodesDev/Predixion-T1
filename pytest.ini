[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts = --strict-markers
markers =
    unit: Fast, isolated unit tests with no I/O.
    api: Tests that drive the FastAPI application in-process.
    integration: Tests that wire the API, resilience layer and mock together.
    slow: Tests that intentionally wait on real time.

[coverage:run]
source =
    app
    mock
branch = True

[coverage:report]
show_missing = True
skip_covered = False
